<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Nhật ký KSNK</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f1f5f4;color:#0f172a;padding-bottom:72px}
header{background:#0f766e;color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5;font-weight:600;font-size:18px}
main{padding:12px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #cbd5e1;z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:13px;color:#64748b}
nav button.on{color:#0f766e;font-weight:700;border-top:3px solid #0f766e;padding-top:7px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
label{display:block;font-size:13px;color:#475569;margin:10px 0 4px}
select,input,textarea{width:100%;font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}
textarea{min-height:70px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:1 1 45%;padding:12px 6px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font:inherit;font-weight:600;text-align:center}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:#0f766e;color:#fff;font:inherit;font-weight:700;margin-top:12px}
.btn.sec{background:#e2e8f0;color:#0f172a}
.btn.red{background:#dc2626}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;margin:4px 4px 0 0;font-size:14px}
.pv{font-weight:600;padding:8px 10px;border-radius:8px;background:#ecfdf5;margin-top:10px}
.pv.bad{background:#fef2f2;color:#b91c1c}
.photo{width:100%;max-height:260px;object-fit:contain;border-radius:8px;margin-top:8px;background:#e2e8f0}
.el{margin:4px 0 8px;padding-left:20px;font-size:13px}
.el li{margin:5px 0}
.erow{display:flex;gap:8px;align-items:center}
.erow .t{flex:1;min-width:0;line-height:1.4;word-break:break-word}
.act{flex:none;display:flex;gap:4px}
.act.multi{flex-direction:column}
.xe{-webkit-user-select:none;user-select:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid #cbd5e1;background:#f8fafc;color:#475569;border-radius:6px;padding:0;width:26px;height:24px}
.xe.del{border-color:#fecaca;background:#fef2f2;color:#dc2626}
.xe svg{width:12px;height:12px;pointer-events:none}
.btn:disabled{opacity:.45}
.gr{flex:none;border:0;background:none;color:#94a3b8;width:22px;height:26px;padding:0;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;display:inline-flex;align-items:center;justify-content:center}
.gr svg{width:16px;height:16px;pointer-events:none}
li.dragging{background:#ccfbf1;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.25);position:relative;z-index:2}
li.dragging .gr{cursor:grabbing}
.dropbefore{box-shadow:0 -2px 0 #0f766e}
.dropafter{box-shadow:0 2px 0 #0f766e}
li.editing .t{color:#94a3b8;font-style:italic}
.addrow{display:flex;gap:8px;align-items:flex-start}
.addrow textarea{min-height:48px;flex:1}
.plus{flex:none;width:48px;height:48px;border:0;border-radius:8px;background:#0f766e;color:#fff;font-size:28px;line-height:1;padding:0}
.pw{position:relative;scroll-margin-bottom:90px}
.px{scroll-margin-bottom:90px}
.px{position:absolute;top:14px;right:6px;width:36px;height:36px;border:0;border-radius:50%;background:rgba(15,23,42,.75);color:#fff;font-size:24px;line-height:1;padding:0}
.rec{display:flex;gap:10px}
.rec img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none}
.rec .b{flex:1;min-width:0}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;color:#fff;font-size:12px;font-weight:600}
.small{font-size:13px;color:#64748b}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid #e2e8f0;text-align:left}
td.n,th.n{text-align:right}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:99px;z-index:20;font-size:14px}
.warn{background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:30;display:none;align-items:center;justify-content:center}
#ov img{max-width:100%;max-height:100%}
#lock{position:fixed;inset:0;background:#0f766e;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:12px;padding:24px}
#lock input{max-width:220px;text-align:center;font-size:22px}
h3{margin:4px 0 8px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<header id="hd">Nhật ký KSNK</header>
<main id="view"></main>
<nav id="nav">
  <button data-t="add">Ghi nhận</button>
  <button data-t="hist">Lịch sử</button>
  <button data-t="stat">Thống kê</button>
  <button data-t="set">Cài đặt</button>
</nav>
<div id="ov"><img id="ovimg" alt=""></div>
<div id="lock">
  <div style="font-size:20px;font-weight:700">Nhập mã PIN</div>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off">
  <button class="btn sec" style="max-width:220px" id="pinok">Mở</button>
  <div id="pinerr"></div>
</div>
<script>
'use strict';
/* ---------- tiện ích ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const mkey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad2(d.getMonth()+1)};
const fmt=ts=>{const d=new Date(ts);return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ---------- cài đặt mặc định ---------- */
const GENERAL='(Chung cả bộ phận)';
const DEF={
  depts:[
    {id:'d1',name:'Ngoại cảnh',staff:[],errors:['Rác, lá cây chưa thu gom','Khu vực tập kết rác chưa sạch','Thùng rác không đậy nắp','Không mang phương tiện bảo hộ']},
    {id:'d2',name:'Nhà giặt',staff:[],errors:['Không phân luồng sạch/bẩn','Không mang phương tiện bảo hộ','Đồ vải sạch để sai nơi quy định','Sai quy trình giặt']},
    {id:'d3',name:'Xử lý dụng cụ',staff:[],errors:['Sai quy trình rửa/khử khuẩn/tiệt khuẩn','Không mang phương tiện bảo hộ','Phân loại dụng cụ chưa đúng','Không ghi sổ/chỉ thị kiểm soát']},
    {id:'d4',name:'Vệ sinh bề mặt (công ty)',staff:[],errors:['Bề mặt chưa sạch','Pha hoá chất sai nồng độ','Không thay găng/khăn đúng quy định','Phân loại rác sai']},
    {id:'d5',name:'Công tác KSNK (khoa phòng)',staff:[],errors:['Không vệ sinh tay đúng thời điểm','Không dùng phương tiện bảo hộ đúng','Xử lý chất thải sai','Vi phạm khác về KSNK']}
  ],
  pts:{n1:1,n2:2,n3:3,nang:5,tot:1},
  grade:{A:90,B:80,C:70},
  base:100,
  pin:'',
  lastBackup:0
};
let S;
function loadS(){try{S=JSON.parse(localStorage.getItem('ksnk_set')||'null')}catch(e){S=null}
  if(!S)S=JSON.parse(JSON.stringify(DEF));
  S.pts=Object.assign({},DEF.pts,S.pts);S.grade=Object.assign({},DEF.grade,S.grade);
  if(typeof S.base!=='number')S.base=100;}
function saveS(){localStorage.setItem('ksnk_set',JSON.stringify(S))}
loadS();

/* ---------- IndexedDB ---------- */
let DB;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('ksnk',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('rec',{keyPath:'id'})};
  r.onsuccess=()=>{DB=r.result;res()};r.onerror=()=>rej(r.error)})}
const tx=(m)=>DB.transaction('rec',m).objectStore('rec');
const dbAll=()=>new Promise((res,rej)=>{const q=tx('readonly').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const dbPut=r=>new Promise((res,rej)=>{const q=tx('readwrite').put(r);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)});
const dbDel=id=>new Promise((res,rej)=>{const q=tx('readwrite').delete(id);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)});
const dbClear=()=>new Promise((res,rej)=>{const q=tx('readwrite').clear();q.onsuccess=()=>res();q.onerror=()=>rej(q.error)});
let RECS=[];
async function reload(){RECS=(await dbAll()).sort((a,b)=>b.ts-a.ts)}

/* ---------- loại ghi nhận & điểm ---------- */
const TYPES=[['dat','Đạt','#16a34a'],['nhac','Nhắc nhở','#d97706'],['nang','Vi phạm nặng','#dc2626'],['tot','Làm tốt (+điểm)','#0891b2'],['ghi','Đề xuất / ghi chú','#2563eb']];
const tinfo=k=>TYPES.find(t=>t[0]===k)||TYPES[0];
function calc(type,dept,who,error,ts){
  const P=S.pts;let count=0,pts=0;
  const same=RECS.filter(r=>(r.type==='nhac'||r.type==='nang')&&(who===GENERAL?r.dept===dept:true)&&r.who===who&&r.error===error&&mkey(r.ts)===mkey(ts));
  if(type==='nhac'){count=same.length+1;pts=-(count===1?P.n1:count===2?P.n2:P.n3)}
  else if(type==='nang'){count=same.length+1;pts=-P.nang}
  else if(type==='tot'){pts=P.tot}
  return {count,pts};
}
function gradeOf(score){const g=S.grade;return score>=g.A?'A':score>=g.B?'B':score>=g.C?'C':'D'}

/* ---------- nén ảnh + đóng dấu giờ ---------- */
function compress(file){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{
    const M=1280,k=Math.min(1,M/Math.max(img.width,img.height));
    const w=Math.round(img.width*k),h=Math.round(img.height*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
    const t=fmt(Date.now()),fs=Math.max(16,Math.round(w/36)),p=8;
    x.font='bold '+fs+'px sans-serif';
    const tw=x.measureText(t).width;
    x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,h-fs-2*p,tw+2*p,fs+2*p);
    x.fillStyle='#fff';x.textBaseline='top';x.fillText(t,p,h-fs-p);
    c.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej(new Error('blob'))},'image/jpeg',0.7)};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};
  img.src=u})}

/* ---------- ZIP (không nén) ---------- */
const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CT[(c^u8[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],cent=[];let off=0;
  const n=new Date(),dt=(n.getHours()<<11)|(n.getMinutes()<<5)|(n.getSeconds()>>1),dd=((n.getFullYear()-1980)<<9)|((n.getMonth()+1)<<5)|n.getDate();
  for(const f of files){
    const nm=enc.encode(f.name),len=f.data.length,c=crc32(f.data);
    const L=new DataView(new ArrayBuffer(30));
    L.setUint32(0,0x04034b50,true);L.setUint16(4,20,true);L.setUint16(6,0x0800,true);L.setUint16(8,0,true);
    L.setUint16(10,dt,true);L.setUint16(12,dd,true);L.setUint32(14,c,true);L.setUint32(18,len,true);L.setUint32(22,len,true);
    L.setUint16(26,nm.length,true);L.setUint16(28,0,true);
    parts.push(L.buffer,nm,f.data);
    const C=new DataView(new ArrayBuffer(46));
    C.setUint32(0,0x02014b50,true);C.setUint16(4,20,true);C.setUint16(6,20,true);C.setUint16(8,0x0800,true);C.setUint16(10,0,true);
    C.setUint16(12,dt,true);C.setUint16(14,dd,true);C.setUint32(16,c,true);C.setUint32(20,len,true);C.setUint32(24,len,true);
    C.setUint16(28,nm.length,true);C.setUint32(42,off,true);
    cent.push(C.buffer,nm);
    off+=30+nm.length+len;
  }
  let cs=0;for(const p of cent)cs+=p.byteLength;
  const E=new DataView(new ArrayBuffer(22));
  E.setUint32(0,0x06054b50,true);E.setUint16(8,files.length,true);E.setUint16(10,files.length,true);E.setUint32(12,cs,true);E.setUint32(16,off,true);
  return new Blob([...parts,...cent,E.buffer],{type:'application/zip'});
}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}

/* ---------- xuất dữ liệu ---------- */
const csvCell=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
function csvOf(list){
  const head=['Ngày giờ','Bộ phận','Đối tượng','Vị trí','Loại','Nội dung','Lần','Điểm','Ghi chú','Tệp ảnh'];
  const rows=list.map(r=>[fmt(r.ts),r.dept,r.who,r.where,tinfo(r.type)[1],r.error,r.count||'',r.pts,r.note,r.photo?r.id+'.jpg':'']);
  return '﻿'+[head,...rows].map(a=>a.map(csvCell).join(',')).join('\r\n');
}
function sel(month){return month==='all'?RECS.slice().reverse():RECS.filter(r=>mkey(r.ts)===month).reverse()}
async function exportCSV(month){download(new Blob([csvOf(sel(month))],{type:'text/csv;charset=utf-8'}),'KSNK_nhac_nho_'+month+'.csv')}
async function exportZip(month){
  const list=sel(month);const files=[];
  files.push({name:'danh_sach.csv',data:new TextEncoder().encode(csvOf(list))});
  for(const r of list){if(r.photo)files.push({name:'anh/'+r.id+'.jpg',data:new Uint8Array(await r.photo.arrayBuffer())})}
  download(makeZip(files),'KSNK_anh_va_danh_sach_'+month+'.zip');
}
function b2d(b){return new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(b)})}
async function backup(){
  const out={v:1,settings:S,records:[]};
  for(const r of RECS){const c=Object.assign({},r);c.photo=r.photo?await b2d(r.photo):null;out.records.push(c)}
  download(new Blob([JSON.stringify(out)],{type:'application/json'}),'KSNK_sao_luu_'+new Date().toISOString().slice(0,10)+'.json');
  S.lastBackup=Date.now();saveS();
}
async function restore(file){
  const d=JSON.parse(await file.text());
  if(!d||!Array.isArray(d.records))throw new Error('Tệp không hợp lệ');
  await dbClear();
  for(const r of d.records){if(r.photo)r.photo=await (await fetch(r.photo)).blob();await dbPut(r)}
  if(d.settings){S=d.settings;loadSFix();saveS()}
  await reload();
}
function loadSFix(){S.pts=Object.assign({},DEF.pts,S.pts);S.grade=Object.assign({},DEF.grade,S.grade);if(typeof S.base!=='number')S.base=100}

/* ---------- giao diện ---------- */
let TAB='add';
const F={dept:'',who:'',type:'nhac',error:'',where:'',note:'',blob:null,url:''};
const view=$('#view');
function applyOrder(i,order){
  const d=S.depts[i];
  if(order.length===d.errors.length&&order.every((t,k)=>t===d.errors[k]))return;
  collect();
  const rest=d.errors.filter(x=>!order.includes(x));
  d.errors=[...order.filter(x=>d.errors.includes(x)),...rest];
  saveS();vSet();
}
function enableDrag(){
  view.querySelectorAll('.gr').forEach(g=>{
    g.onpointerdown=e=>{
      e.preventDefault();
      const li=g.closest('li'),ul=li.parentNode,i=+g.dataset.gr;
      try{g.setPointerCapture(e.pointerId)}catch(_){}
      li.classList.add('dragging');
      const y0=e.clientY,s0=scrollY;let y=y0,raf=0,before=null;
      const mark=()=>{
        ul.querySelectorAll('.dropbefore,.dropafter').forEach(x=>x.classList.remove('dropbefore','dropafter'));
        const items=[...ul.children].filter(x=>x!==li);
        before=null;
        for(const it of items){const r=it.getBoundingClientRect();if(y<r.top+r.height/2){before=it;break}}
        if(before)before.classList.add('dropbefore');else if(items.length)items[items.length-1].classList.add('dropafter');
      };
      const upd=()=>{li.style.transform='translateY('+((y-y0)+(scrollY-s0))+'px)';mark()};
      const step=()=>{
        if(y<90)scrollBy(0,-12);else if(y>innerHeight-110)scrollBy(0,12);
        upd();raf=requestAnimationFrame(step);
      };
      raf=requestAnimationFrame(step);
      const mv=ev=>{y=ev.clientY;upd()};
      const up=()=>{
        cancelAnimationFrame(raf);
        g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);
        li.classList.remove('dragging');li.style.transform='';
        const order=[];
        for(const it of ul.children){
          if(it===li)continue;
          if(it===before)order.push(li.querySelector('.t').textContent);
          order.push(it.querySelector('.t').textContent);
        }
        if(!before)order.push(li.querySelector('.t').textContent);
        ul.querySelectorAll('.dropbefore,.dropafter').forEach(x=>x.classList.remove('dropbefore','dropafter'));
        applyOrder(i,order);
      };
      g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up);
    };
  });
}
function fitActs(){view.querySelectorAll('.erow').forEach(r=>{const t=r.querySelector('.t'),a=r.querySelector('.act');a.classList.remove('multi');const lh=parseFloat(getComputedStyle(t).lineHeight)||18;a.classList.toggle('multi',t.getBoundingClientRect().height>lh*1.5)})}
window.addEventListener('resize',()=>{if(TAB==='set')fitActs()});
function setTab(t){if(t!==TAB)EDIT=null;TAB=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render()}
function render(){({add:vAdd,hist:vHist,stat:vStat,set:vSet})[TAB]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));

function months(){const s=new Set([mkey(Date.now())]);RECS.forEach(r=>s.add(mkey(r.ts)));return [...s].sort().reverse()}
function backupBanner(){
  if(!RECS.length)return '';
  const days=S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5):999;
  if(days<7)return '';
  return '<div class="warn">Chưa sao lưu '+(S.lastBackup?days+' ngày':'lần nào')+'. Vào <b>Cài đặt → Sao lưu</b> để tránh mất dữ liệu khi đổi hoặc mất điện thoại.</div>';
}

function vAdd(){
  if(!S.depts.length){view.innerHTML='<div class="card">Chưa có bộ phận. Vào Cài đặt để thêm.</div>';return}
  if(!S.depts.find(d=>d.id===F.dept)){F.dept=S.depts[0].id;F.who='';F.error=''}
  const D=S.depts.find(d=>d.id===F.dept);
  const people=[GENERAL,...D.staff];
  if(!people.includes(F.who))F.who=people[0];
  const needErr=F.type==='nhac'||F.type==='nang';
  const errs=[...D.errors,'Khác'];
  if(!errs.includes(F.error))F.error=errs[0];
  const c=calc(F.type,D.name,F.who,needErr?F.error:'',Date.now());
  let pv='';
  if(F.type==='nhac')pv='Nhắc lần '+c.count+' trong tháng → '+c.pts+' điểm';
  else if(F.type==='nang')pv='Vi phạm nặng (lần '+c.count+') → '+c.pts+' điểm';
  else if(F.type==='tot')pv='Cộng '+c.pts+' điểm';
  else pv='Không tính điểm';
  view.innerHTML=backupBanner()+`<div class="card">
  <label>Bộ phận</label><select id="fd">${S.depts.map(d=>`<option value="${d.id}" ${d.id===F.dept?'selected':''}>${esc(d.name)}</option>`).join('')}</select>

const fp=p=>(p>0?'+':'')+p;
function personRows(list){
  const m=new Map();
  for(const r of list){
    const gen=r.who===GENERAL;
    const k=gen?r.dept+'\u0001'+GENERAL:r.who;
    if(!m.has(k))m.set(k,{who:r.who,gen,nhac:0,nang:0,tot:0,pts:0,depts:{},errs:{}});
    const o=m.get(k);
    const d=o.depts[r.dept]||(o.depts[r.dept]={nhac:0,nang:0,tot:0,pts:0});
    for(const t of [o,d]){
      if(r.type==='nhac')t.nhac++;else if(r.type==='nang')t.nang++;else if(r.type==='tot')t.tot++;
      t.pts+=r.pts||0;
    }
    if(r.error&&(r.type==='nhac'||r.type==='nang')){
      const ek=r.dept+'\u0001'+r.error;
      const e=o.errs[ek]||(o.errs[ek]={dept:r.dept,error:r.error,n:0,pts:0});
      e.n++;e.pts+=r.pts||0;
    }
  }
  return [...m.values()].map(o=>(o.score=S.base+o.pts,o.grade=gradeOf(o.score),o)).sort((a,b)=>a.score-b.score);
}

}
let EDIT=null;
const cleanErr=s=>s.replace(/^[\s\-*\u2022\u00b7\u2013]+/,'').replace(/\s*\u2715\s*$/,'').trim();
function collect(){
  view.querySelectorAll('#dl [data-i]').forEach(el=>{
    const d=S.depts[+el.dataset.i];if(!d)return;
    d.name=el.querySelector('.dn').value.trim()||d.name;
    const lines=t=>t.split('\n').map(s=>s.trim()).filter(Boolean);
    d.staff=lines(el.querySelector('.ds').value);
    const de=el.querySelector('.de');
    const nl=lines(de.value).map(cleanErr).filter(Boolean);
    const idx=+el.dataset.i;
    const pos=(EDIT&&EDIT.i===idx)?d.errors.indexOf(EDIT.text):-1;
    if(pos>=0){
      if(nl.length){
        const others=new Set(d.errors.filter((_,k)=>k!==pos).map(y=>y.toLowerCase()));
        const fresh=[];for(const x of nl){const k=x.toLowerCase();if(!others.has(k)&&!fresh.some(y=>y.toLowerCase()===k))fresh.push(x)}
        d.errors.splice(pos,1,...fresh);
      }
      EDIT=null;
    }else{
      for(const x of nl){if(!d.errors.some(y=>y.toLowerCase()===x.toLowerCase()))d.errors.push(x)}
    }
    de.value='';
  });
}

/* ---------- PIN ---------- */
async function hashPin(p){
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ksnk:'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h=5381;for(const ch of 'ksnk:'+p)h=((h<<5)+h+ch.charCodeAt(0))>>>0;return 'x'+h;
}
function lockIfNeeded(){
  if(!S.pin)return;
  $('#lock').style.display='flex';
  $('#pinok').onclick=async()=>{
    if(await hashPin($('#pin').value.trim())===S.pin){$('#lock').style.display='none';$('#pin').value='';$('#pinerr').textContent=''}
    else $('#pinerr').textContent='Sai mã PIN';
  };
}

/* ---------- khởi động ---------- */
(async()=>{
  try{await openDB();await reload()}catch(e){view.innerHTML='<div class="card">Trình duyệt không cho phép lưu dữ liệu: '+esc(e.message)+'</div>';return}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  lockIfNeeded();setTab('add');
  if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
